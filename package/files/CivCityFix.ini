; CivCityFix settings (read when the game starts)

[Display]
; 1 = run the game's fullscreen as a centered borderless window on a black background
;     (4:3 fills the screen height without stretching, fast Alt+Tab)
; 0 = pass the game's real exclusive fullscreen through to DXVK
Borderless=1

; Extra resolutions offered to the game, comma separated.
; "auto" = 4:3 at your monitor's full height (1920x1440 on 1440p, 1440x1080 on 1080p,
; 2880x2160 on 4K). The resolution you play at is stored by the game in
; Documents\CivCity Rome\CivCityRome.GraphicsSettings.xml.
ExtraModes=auto,1600x1200
